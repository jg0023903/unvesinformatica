<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>Formulario de Registro</title>
</head>
<body>
    <h2>Formulario de Registro</h2>
    <form id="login-form">
        <label for="nombre">Nombre:</label><br>
        <input type="text" id="nombre" required minlength="3" placeholder="Tu nombre"><br><br>
        <label for="email">Correo Electrónico:</label><br>
        <input type="email" id="email" required placeholder="example@domain.com"><br><br>
        <label for="password">Contraseña:</label><br>
        <input type="password" id="password" required placeholder="Tu contraseña"><br><br>
        <label for="edad">Edad:</label><br>
        <input type="number" id="edad" min="18"><br><br>
        <label for="fecha">Fecha de Nacimiento:</label><br>
        <input type="date" id="fecha"><br><br>
        <input type="checkbox" id="terminos" required>
        <label for="terminos">Acepto los términos y condiciones</label><br><br>
        <button type="submit">Enviar</button>
    </form>
    <script src="confirm.JS"></script>
</body>
</html>
